# CI — <NOME_DO_SISTEMA>
#
# Para que serve: pipeline de integracao continua que roda em todo push/PR
# para as branches principais — lint, formatacao, scan de vulnerabilidade de
# dependencias e testes com cobertura minima. Bloqueia merge se algo falhar.
#
# Template reutilizavel. Copie para .github/workflows/ci-cd.yml, substitua
# os placeholders <ENTRE_ANGULOS> e apague os comentarios marcados com
# "guia:" e os blocos opcionais que nao se aplicam ao projeto.
#
# Nota de sintaxe: os placeholders usam <ANGULO>, nao {{chaves}}, de
# proposito — o GitHub Actions ja usa ${{ }} para suas proprias expressoes
# (ex: ${{ secrets.NOME }} mais abaixo), e misturar as duas sintaxes
# confunde leitura. Nao troque os placeholders deste arquivo para {{chaves}}.
#
# Placeholders deste template:
#   <NOME_DO_SISTEMA>          Nome do sistema/repositorio, so para o titulo deste comentario
#   <BRANCH_DESENVOLVIMENTO>   Branch de desenvolvimento (ex: develop)
#   <BRANCH_PRODUCAO>          Branch de producao (ex: master, main)
#   <RUNTIME_SETUP_ACTION>     Action de setup do runtime (ex: actions/setup-python@v5, actions/setup-node@v4, actions/setup-dotnet@v4)
#   <RUNTIME_VERSAO_INPUT>     Nome do input de versao da action acima (ex: python-version, node-version, dotnet-version)
#   <RUNTIME_VERSAO>           Versao do runtime
#   <RUNTIME_CACHE>            Gerenciador de pacotes usado pelo cache da action de setup (ex: pip, npm, pnpm)
#   <CMD_INSTALL_DEPS>         Comando de instalacao de dependencias
#   <CMD_LINT>                 Comando de lint
#   <CMD_FORMAT_CHECK>         Comando de verificacao de formatacao (apague o step se o projeto nao separa lint de formatacao)
#   <CMD_SECURITY_SCAN>        Comando de scan de vulnerabilidades de dependencias
#   <CMD_TEST_COVERAGE>        Comando de teste com cobertura
#   <COBERTURA_MINIMA>         Percentual minimo de cobertura exigido, so para o nome do step
#   <CAMINHO_RELATORIO_COBERTURA> Caminho do arquivo de relatorio de cobertura gerado pelos testes

name: CI

on:
  push:
    branches: ["<BRANCH_DESENVOLVIMENTO>", "<BRANCH_PRODUCAO>"]
  pull_request:
    branches: ["<BRANCH_DESENVOLVIMENTO>", "<BRANCH_PRODUCAO>"]

jobs:
  test:
    name: Lint, Scan & Test
    runs-on: ubuntu-latest

    # guia: bloco opcional. Mantenha apenas se os testes precisarem de um
    # banco de dados real subindo no runner. Apague o bloco "services"
    # inteiro (e a variavel DATABASE_URL abaixo) se o projeto nao usa banco
    # em CI, ou se os testes usam banco em memoria/sqlite/mocks.
    services:
      db:
        image: "<SERVICO_BANCO_IMAGEM>"
        env:
          POSTGRES_USER: "<SERVICO_BANCO_USUARIO>"
          POSTGRES_PASSWORD: "<SERVICO_BANCO_SENHA>"
          POSTGRES_DB: "<SERVICO_BANCO_NOME>"
        ports:
          - "<SERVICO_BANCO_PORTA>:<SERVICO_BANCO_PORTA>"
        options: >-
          --health-cmd "<SERVICO_BANCO_HEALTHCHECK>"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    # guia: variaveis de ambiente usadas apenas dentro do runner do CI.
    # Valores fake/locais aqui sao aceitaveis porque o ambiente e efemero —
    # nunca coloque um segredo real em texto puro; segredos reais vao em
    # ${{ secrets.NOME }}, configurados em Settings > Secrets and variables.
    env:
      DATABASE_URL: "<CI_DATABASE_URL>"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar runtime
        uses: "<RUNTIME_SETUP_ACTION>"
        with:
          "<RUNTIME_VERSAO_INPUT>": "<RUNTIME_VERSAO>"
          cache: "<RUNTIME_CACHE>"

      - name: Instalar dependencias
        run: <CMD_INSTALL_DEPS>

      - name: Lint
        run: <CMD_LINT>

      - name: Formatacao
        run: <CMD_FORMAT_CHECK>

      # Bloqueia o pipeline se aparecer dependencia com vulnerabilidade conhecida.
      - name: Scan de vulnerabilidades das dependencias
        run: <CMD_SECURITY_SCAN>

      - name: Rodar testes com cobertura (meta minima <COBERTURA_MINIMA>%)
        run: <CMD_TEST_COVERAGE>

      - name: Upload do relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "<CAMINHO_RELATORIO_COBERTURA>"
          retention-days: 7

# Como adaptar este template a um novo projeto:
#   1. Substitua todos os placeholders <ENTRE_ANGULOS>.
#   2. Se o projeto nao usa banco em CI, apague o bloco "services" e a
#      variavel DATABASE_URL.
#   3. Se o projeto nao separa lint de formatacao (ex: uma unica ferramenta
#      faz as duas coisas), apague o step "Formatacao" e ajuste o step
#      "Lint" para rodar o comando unico.
#   4. Ajuste os nomes dos jobs/steps se o time usa outra nomenclatura.
#   5. Apague este bloco de comentario final antes de commitar o arquivo real.
