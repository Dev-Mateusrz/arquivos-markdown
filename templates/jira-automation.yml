# Jira Automation — <NOME_DO_SISTEMA>
#
# Para que serve: mover o card da issue no Jira automaticamente conforme o
# fluxo Git avanca (nova branch, PR aberto, PR mergeado), sem exigir que
# ninguem atualize o board manualmente. Chama o script jira.py.
#
# Template reutilizavel. Copie para .github/workflows/jira-automation.yml,
# copie tambem o script jira.py deste mesmo diretorio de templates para
# .github/workflows/scripts/jira.py, substitua os placeholders
# <ENTRE_ANGULOS> nos comentarios abaixo e apague este cabecalho.
#
# -----------------------------------------------------------------------------
# Sincroniza o status do card no Jira a partir do fluxo Git do repositorio.
# Pressupoe a convencao de branch documentada no CLAUDE.md do projeto:
# <tipo>/<PREFIXO_ISSUE>-<id>-<descricao>, onde cada branch corresponde a
# uma unica issue no rastreador (nao usa a API do GitHub para listar commits
# do PR — o nome da branch ja e suficiente).
#
#   1. Push que cria uma branch nova (feature/bugfix/fix/hotfix/chore/docs/
#      refactor/test)
#      -> card vai para o status "Em andamento" (transition <ID_TRANSICAO_FAZENDO>)
#
#   2. Pull request aberto (para <BRANCH_DESENVOLVIMENTO> ou <BRANCH_PRODUCAO>)
#      -> card vai para o status "Em revisao" (transition <ID_TRANSICAO_EM_ANALISE>)
#
#   3. Pull request fechado com merge (para <BRANCH_DESENVOLVIMENTO> ou <BRANCH_PRODUCAO>)
#      -> card vai para o status "Concluido" (transition <ID_TRANSICAO_FEITO>)
#
# Os IDs de transicao sao especificos do workflow Jira de cada projeto —
# descubra-os chamando a API do Jira (GET /rest/api/3/issue/{key}/transitions)
# em uma issue real do projeto, nao adivinhe.
#
# Secrets necessarios no repositorio (Settings > Secrets and variables >
# Actions):
#   JIRA_BASE_URL    <URL_BASE_JIRA> (ex: https://sua-organizacao.atlassian.net)
#   JIRA_USER_EMAIL  email da conta Atlassian usada pela automacao
#   JIRA_API_TOKEN   gerado em id.atlassian.com -> Security -> API tokens
# -----------------------------------------------------------------------------

name: Jira Automation

on:
  push:
  pull_request:
    types: [opened, closed]

# Nao bloquear nada - automacao e "best effort": se o Jira estiver fora, nao
# impede o desenvolvimento. Falha so marca a run vermelha pra olhar depois.
permissions:
  contents: read
  pull-requests: read

jobs:
  inicio-de-implementacao:
    name: Mover card para "Em andamento" (nova branch)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.event.created == true

    steps:
      - name: Checkout (script)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/scripts
          sparse-checkout-cone-mode: false

      - name: Transicionar issue da branch
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python3 .github/workflows/scripts/jira.py iniciar --branch "${{ github.ref_name }}"

  pr-aberto:
    name: Mover card para "Em revisao" (PR aberto)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened'

    steps:
      - name: Checkout (script)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/scripts
          sparse-checkout-cone-mode: false

      - name: Transicionar issue da branch
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python3 .github/workflows/scripts/jira.py pr-aberto --branch "${{ github.head_ref }}"

  pr-mergeado:
    name: Mover card para "Concluido" (PR mergeado)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.merged == true

    steps:
      - name: Checkout (script)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/scripts
          sparse-checkout-cone-mode: false

      - name: Transicionar issue da branch
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python3 .github/workflows/scripts/jira.py pr-mergeado --branch "${{ github.head_ref }}"

# Como adaptar este template a um novo projeto:
#   1. Copie jira.py para .github/workflows/scripts/jira.py e siga o
#      cabecalho de adaptacao daquele arquivo (prefixo de issue, IDs de
#      transicao).
#   2. Substitua os placeholders <ENTRE_ANGULOS> no comentario do topo.
#   3. Cadastre os tres secrets no repositorio.
#   4. Apague este bloco de comentario final antes de commitar o arquivo real.
