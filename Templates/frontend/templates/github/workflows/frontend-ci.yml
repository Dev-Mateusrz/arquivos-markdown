# Copie para .github/workflows/frontend-ci.yml e substitua os placeholders.
# Copie e configure também .githooks/ conforme o README dos templates de hooks.
# Disponibilize o gerenciador escolhido no runner antes de usar seu cache.
# Instalação, tipagem, lint, testes, documentação, auditoria e bundle usam os
# comandos do projeto. O instalador de hooks ignora CI; não é necessário
# desativar todos os scripts de dependências apenas para evitar instalar hooks.
name: Frontend — validação da entrega

on:
  pull_request:
    branches: ['{{BRANCH_DESENVOLVIMENTO}}', '{{BRANCH_PRODUCAO}}']
  push:
    branches: ['{{BRANCH_DESENVOLVIMENTO}}', '{{BRANCH_PRODUCAO}}']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Validar código, documentação, dependências e bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Valida apenas os commits do intervalo do PR; merges são ignorados.
      # Para squash por título de PR, acrescente também a validação desse título.
      - name: Validar mensagens de commits do PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP_GIT_HOOKS: '0'
        shell: sh
        run: |
          set -eu
          list=$(mktemp)
          message=$(mktemp)
          trap 'rm -f "$list" "$message"' 0
          git rev-list --no-merges "$BASE_SHA..$HEAD_SHA" -- > "$list"
          while IFS= read -r commit; do
            git show -s --format=%B "$commit" > "$message"
            sh .githooks/commit-msg "$message"
          done < "$list"

      - uses: actions/setup-node@v4
        with:
          node-version: '{{VERSAO_NODE}}'
          cache: '{{GERENCIADOR_PACOTES}}'

      - name: Instalar dependências
        env:
          SKIP_GIT_HOOKS: '1'
        run: |
          {{CMD_INSTALL_CI_FRONTEND}}

      - name: Checar tipos
        run: |
          {{CMD_TYPECHECK_FRONTEND}}

      # Audite em todo CI: advisories podem surgir sem mudar o lockfile.
      # Não use audit fix nem ignore erros de rede nesta etapa obrigatória.
      - name: Auditar dependências
        run: |
          {{CMD_AUDIT_FRONTEND}}

      - name: Lint
        run: |
          {{CMD_LINT_FRONTEND}}

      - name: Testes
        run: |
          {{CMD_TEST_FRONTEND}}

      - name: Validar documentação
        run: |
          {{CMD_DOCS_CHECK_FRONTEND}}

      - name: Compilar
        run: |
          {{CMD_BUILD_FRONTEND}}

      # Use os artefatos recém-gerados acima; não compile uma segunda vez.
      - name: Validar orçamento de bundle
        run: |
          {{CMD_BUNDLE_CHECK_FRONTEND}}

# Placeholders: branches de desenvolvimento/produção, versão Node,
# gerenciador aceito pelo cache de setup-node e comandos reais do projeto.
# Remova etapas que não se aplicam de forma justificada (ex.: tipos sem TS).
# Configure no servidor a proteção de branches e os checks obrigatórios.
# Não restrinja este workflow apenas à produção: hooks locais são contornáveis.
